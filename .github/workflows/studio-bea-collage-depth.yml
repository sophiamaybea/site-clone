name: Check animated paper-collage scene
on:
  workflow_dispatch:
  push:
    paths:
      - 'studio-bea-pear-hybrid/collage-study/**'
      - 'evals/studio_bea_collage_depth.cjs'
      - '.github/workflows/studio-bea-collage-depth.yml'
permissions:
  contents: read
jobs:
  collage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.64.0
          npx playwright install --with-deps chromium
      - name: Verify all layers at desktop and mobile scroll checkpoints
        run: node evals/studio_bea_collage_depth.cjs
      - name: Archive scene screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-bea-collage-depth-screenshots
          path: collage-study-evidence/
          if-no-files-found: ignore
