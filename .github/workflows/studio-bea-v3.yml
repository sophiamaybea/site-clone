name: Inspect Studio Bea editorial redesign
on:
  workflow_dispatch:
  push:
    paths:
      - 'studio-bea-pear-hybrid/v3/**'
      - 'evals/studio_bea_v3.cjs'
      - '.github/workflows/studio-bea-v3.yml'
permissions:
  contents: read
jobs:
  visual-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install real browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.64.0
          npx playwright install --with-deps chromium
      - name: Review actual scrolled scenes and agency content
        run: node evals/studio_bea_v3.cjs
      - name: Preserve visual captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bea-editorial-redesign-evidence
          path: atelier-v3-audit/
          if-no-files-found: ignore
