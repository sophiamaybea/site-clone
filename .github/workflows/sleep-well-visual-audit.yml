name: Audit Sleep Well reproduction
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sleep-well-visual-audit.yml
      - evals/sleep_well_audit.cjs

permissions:
  contents: read

jobs:
  visual-and-functional-evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install browser automation and image-diff dependencies
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.64.0 pngjs@7.0.0 pixelmatch@7.1.0
          npx playwright install --with-deps chromium
      - name: Compare reference and clone at desktop and mobile sizes
        run: node evals/sleep_well_audit.cjs
      - name: Publish screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sleep-well-visual-audit
          path: audit-*.png
          if-no-files-found: ignore
