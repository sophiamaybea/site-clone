name: Verify Studio Bea source-prototype fidelity
on:
  workflow_dispatch:
  push:
    paths:
      - "evals/bea_prototype_baseline.cjs"
      - "studio-bea-prototype/**"
      - ".github/workflows/bea-prototype-audit.yml"
permissions:
  contents: read
jobs:
  browser-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.64.0
          npx playwright install --with-deps chromium
      - name: Compare prototype with original, including entered 3D scenes
        run: node evals/bea_prototype_baseline.cjs
      - name: Archive visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bea-sleepwell-prototype-baseline
          path: bea-prototype-evidence/
          if-no-files-found: ignore
